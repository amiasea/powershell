name: CI

on:
  push:
    tags:
      - '*-v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest

    outputs:
      module: ${{ steps.tag.outputs.module }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse tag
        id: tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^(?<module>.+)-v(?<version>\d+\.\d+\.\d+)$') {
              throw "Invalid module tag: $env:TAG"
          }

          $module = $Matches.module
          $version = $Matches.version

          "module=$module" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

          Write-Host "Module:  $module"
          Write-Host "Version: $version"

      - name: Prepare build
        shell: pwsh
        env:
          MODULE: ${{ steps.tag.outputs.module }}
        run: |
          $modulePath = Join-Path $PWD "src/$env:MODULE"
          $metadataPath = Join-Path $modulePath "$env:MODULE.json"
          $buildPath = Join-Path $PWD ".build/$env:MODULE"
          $outPath = Join-Path $buildPath "out"
          $packagesPath = Join-Path $buildPath "packages"
          $resourcesPath = Join-Path $buildPath "resources"

          if (-not (Test-Path $modulePath -PathType Container)) {
              throw "Module directory not found: $modulePath"
          }

          if (-not (Test-Path $metadataPath -PathType Leaf)) {
              throw "Module metadata not found: $metadataPath"
          }

          New-Item `
              -ItemType Directory `
              -Path $buildPath `
              -Force |
              Out-Null

          New-Item `
              -ItemType Directory `
              -Path $outPath `
              -Force |
              Out-Null

          New-Item `
              -ItemType Directory `
              -Path $packagesPath `
              -Force |
              Out-Null

          New-Item `
              -ItemType Directory `
              -Path $resourcesPath `
              -Force |
              Out-Null

          Get-ChildItem `
              -Path $modulePath `
              -Force |
              Where-Object {
                  $_.Name -ne "$env:MODULE.json" -and
                  $_.Name -ne "$env:MODULE.psd1"
              } |
              Copy-Item `
                  -Destination $outPath `
                  -Recurse `
                  -Force

          Write-Host "Build output: $outPath"
          Write-Host "NuGet packages: $packagesPath"
          Write-Host "PSResources: $resourcesPath"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ steps.tag.outputs.module }}
          path: .build/${{ steps.tag.outputs.module }}
          if-no-files-found: error


  restore:
    name: Restore
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: build-${{ needs.prepare.outputs.module }}
          path: .build/${{ needs.prepare.outputs.module }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore NuGet package references
        shell: pwsh
        env:
          MODULE: ${{ needs.prepare.outputs.module }}
        run: |
          $modulePath = Join-Path $PWD "src/$env:MODULE"
          $metadataPath = Join-Path $modulePath "$env:MODULE.json"
          $buildPath = Join-Path $PWD ".build/$env:MODULE"
          $projectPath = Join-Path $buildPath "$env:MODULE.csproj"
          $packagesPath = Join-Path $buildPath "packages"

          $metadata = Get-Content $metadataPath -Raw |
              ConvertFrom-Json

          $packageReferences = @($metadata.packageReferences)

          if ($packageReferences.Count -eq 0) {
              Write-Host "No NuGet package references declared."
              exit 0
          }

          $references = foreach ($package in $packageReferences) {
              if (-not $package.packageName) {
                  throw "NuGet package reference is missing packageName."
              }

              if (-not $package.packageVersion) {
                  throw "NuGet package '$($package.packageName)' is missing packageVersion."
              }

              @"
              <PackageReference Include="$($package.packageName)" Version="$($package.packageVersion)" />
          "@
          }

          $project = @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <RestorePackagesWithLockFile>false</RestorePackagesWithLockFile>
            </PropertyGroup>

            <ItemGroup>
          $($references -join "`n")
            </ItemGroup>
          </Project>
          "@

          Set-Content `
              -Path $projectPath `
              -Value $project `
              -Encoding utf8

          Write-Host "Generated restore project:"
          Write-Host $project

          dotnet restore `
              $projectPath `
              --packages $packagesPath

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ needs.prepare.outputs.module }}
          path: .build/${{ needs.prepare.outputs.module }}
          if-no-files-found: error
          overwrite: true


  materialize:
    name: Materialize
    needs: [prepare, restore]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: build-${{ needs.prepare.outputs.module }}
          path: .build/${{ needs.prepare.outputs.module }}

      - name: Materialize NuGet assets
        shell: pwsh
        env:
          MODULE: ${{ needs.prepare.outputs.module }}
        run: |
          $modulePath = Join-Path $PWD "src/$env:MODULE"
          $metadataPath = Join-Path $modulePath "$env:MODULE.json"
          $buildPath = Join-Path $PWD ".build/$env:MODULE"
          $assetsPath = Join-Path $buildPath "obj/project.assets.json"
          $packagesPath = Join-Path $buildPath "packages"
          $outPath = Join-Path $buildPath "out"
          $libPath = Join-Path $outPath "lib"
          $runtimePath = Join-Path $outPath "runtimes"

          $metadata = Get-Content $metadataPath -Raw |
              ConvertFrom-Json

          $packageReferences = @($metadata.packageReferences)

          if ($packageReferences.Count -eq 0) {
              Write-Host "No NuGet package references to materialize."
              exit 0
          }

          if (-not (Test-Path $assetsPath -PathType Leaf)) {
              throw "NuGet assets file not found: $assetsPath"
          }

          $assets = Get-Content $assetsPath -Raw |
              ConvertFrom-Json

          $targets = @(
              $assets.targets.PSObject.Properties
          )

          if ($targets.Count -eq 0) {
              throw "NuGet restore did not produce any target frameworks."
          }

          New-Item `
              -ItemType Directory `
              -Path $libPath `
              -Force |
              Out-Null

          New-Item `
              -ItemType Directory `
              -Path $runtimePath `
              -Force |
              Out-Null

          $packageLibraries = @(
              $assets.libraries.PSObject.Properties |
                  Where-Object {
                      $_.Value.type -eq 'package'
                  }
          )

          foreach ($library in $packageLibraries) {
              if ($library.Name -notmatch '^(?<id>.+)/(?<version>[^/]+)$') {
                  throw "Unable to parse NuGet package identity: $($library.Name)"
              }

              $packageName = $Matches.id
              $packageVersion = $Matches.version

              $packageRoot = Join-Path `
                  $packagesPath `
                  $packageName.ToLowerInvariant()

              $packageRoot = Join-Path `
                  $packageRoot `
                  $packageVersion.ToLowerInvariant()

              if (-not (Test-Path $packageRoot -PathType Container)) {
                  throw "Restored package directory not found: $packageRoot"
              }

              Write-Host ""
              Write-Host "Materializing package: $packageName $packageVersion"

              foreach ($target in $targets) {
                  $targetName = $target.Name

                  $targetLibrary = $target.Value.PSObject.Properties |
                      Where-Object {
                          $_.Name -eq $library.Name
                      } |
                      Select-Object -ExpandProperty Value -First 1

                  if (-not $targetLibrary) {
                      continue
                  }

                  Write-Host "  Target: $targetName"

                  $assetPaths = @()

                  if ($targetLibrary.compile) {
                      $assetPaths += @(
                          $targetLibrary.compile.PSObject.Properties.Name
                      )
                  }

                  if ($targetLibrary.runtime) {
                      $assetPaths += @(
                          $targetLibrary.runtime.PSObject.Properties.Name
                      )
                  }

                  $assetPaths = @(
                      $assetPaths |
                          Select-Object -Unique
                  )

                  foreach ($assetPath in $assetPaths) {
                      $sourcePath = Join-Path `
                          $packageRoot `
                          $assetPath

                      if (-not (Test-Path $sourcePath -PathType Leaf)) {
                          throw "NuGet asset not found: $sourcePath"
                      }

                      if ($assetPath -like 'lib/*') {
                          $relativePath = $assetPath.Substring(4)
                          $destinationPath = Join-Path `
                              $libPath `
                              $relativePath

                          $destinationDirectory = Split-Path `
                              $destinationPath `
                              -Parent

                          New-Item `
                              -ItemType Directory `
                              -Path $destinationDirectory `
                              -Force |
                              Out-Null

                          Copy-Item `
                              -LiteralPath $sourcePath `
                              -Destination $destinationPath `
                              -Force

                          Write-Host "    Managed: $assetPath"
                      }
                      elseif ($assetPath -like 'runtimes/*') {
                          $relativePath = $assetPath.Substring(9)
                          $destinationPath = Join-Path `
                              $runtimePath `
                              $relativePath

                          $destinationDirectory = Split-Path `
                              $destinationPath `
                              -Parent

                          New-Item `
                              -ItemType Directory `
                              -Path $destinationDirectory `
                              -Force |
                              Out-Null

                          Copy-Item `
                              -LiteralPath $sourcePath `
                              -Destination $destinationPath `
                              -Force

                          Write-Host "    Runtime: $assetPath"
                      }
                  }
              }
          }

          Write-Host ""
          Write-Host "Materialized managed assemblies:"

          if (Test-Path $libPath -PathType Container) {
              Get-ChildItem `
                  -Path $libPath `
                  -Filter '*.dll' `
                  -Recurse |
                  ForEach-Object {
                      Write-Host "  $($_.FullName.Substring($outPath.Length + 1))"
                  }
          }

          Write-Host ""
          Write-Host "Materialized runtime assets:"

          if (Test-Path $runtimePath -PathType Container) {
              Get-ChildItem `
                  -Path $runtimePath `
                  -Recurse `
                  -File |
                  ForEach-Object {
                      Write-Host "  $($_.FullName.Substring($outPath.Length + 1))"
                  }
          }

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ needs.prepare.outputs.module }}
          path: .build/${{ needs.prepare.outputs.module }}
          if-no-files-found: error
          overwrite: true


  manifest:
    name: Manifest
    needs: [prepare, materialize]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: build-${{ needs.prepare.outputs.module }}
          path: .build/${{ needs.prepare.outputs.module }}

      - name: Build module manifest
        shell: pwsh
        env:
          MODULE: ${{ needs.prepare.outputs.module }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $modulePath = Join-Path $PWD "src/$env:MODULE"
          $metadataPath = Join-Path $modulePath "$env:MODULE.json"
          $buildPath = Join-Path $PWD ".build/$env:MODULE"
          $outPath = Join-Path $buildPath "out"

          $packageName = "Amiasea.$env:MODULE"
          $manifestPath = Join-Path $outPath "$packageName.psd1"

          $rootModule = "$env:MODULE.psm1"
          $rootModulePath = Join-Path $outPath $rootModule

          if (-not (Test-Path $metadataPath -PathType Leaf)) {
              throw "Module metadata not found: $metadataPath"
          }

          if (-not (Test-Path $rootModulePath -PathType Leaf)) {
              throw "Module file not found: $rootModulePath"
          }

          $metadata = Get-Content $metadataPath -Raw |
              ConvertFrom-Json

          if (-not $metadata.guid) {
              throw "Module metadata does not contain a guid: $metadataPath"
          }

          $guid = [Guid]$metadata.guid

          $requiredModules = @(
              foreach ($requiredModule in @($metadata.requiredModules)) {
                  if (-not $requiredModule.moduleName) {
                      throw "Required PowerShell module is missing moduleName."
                  }

                  if (-not $requiredModule.moduleVersion) {
                      throw "Required PowerShell module '$($requiredModule.moduleName)' is missing moduleVersion."
                  }

                  if (-not $requiredModule.repository) {
                      throw "Required PowerShell module '$($requiredModule.moduleName)' is missing repository."
                  }

                  @{
                      ModuleName    = [string]$requiredModule.moduleName
                      ModuleVersion = [string]$requiredModule.moduleVersion
                  }
              }
          )

          $libPath = Join-Path $outPath "lib"

          $requiredAssemblies = @(
              if (Test-Path $libPath -PathType Container) {
                  Get-ChildItem `
                      -Path $libPath `
                      -Filter '*.dll' `
                      -Recurse |
                      ForEach-Object {
                          $_.FullName.Substring($outPath.Length + 1).Replace('\', '/')
                      } |
                      Sort-Object
              }
          )

          Write-Host "Required PowerShell modules:"
          foreach ($requiredModule in $requiredModules) {
              Write-Host "  $($requiredModule.ModuleName) $($requiredModule.ModuleVersion)"
          }

          Write-Host ""
          Write-Host "Required managed assemblies:"
          foreach ($assembly in $requiredAssemblies) {
              Write-Host "  $assembly"
          }

          New-ModuleManifest `
              -Path $manifestPath `
              -RootModule $rootModule `
              -ModuleVersion $env:VERSION `
              -Guid $guid `
              -Author 'Amiasea' `
              -CompanyName 'Amiasea' `
              -Copyright 'Copyright © 2026 Amiasea' `
              -Description "Amiasea $env:MODULE PowerShell module." `
              -PowerShellVersion '7.6' `
              -CompatiblePSEditions 'Core' `
              -RequiredModules $requiredModules `
              -RequiredAssemblies $requiredAssemblies `
              -FunctionsToExport @(
                  "Resolve-$env:MODULE"
                  "Build-$env:MODULE"
              ) `
              -CmdletsToExport @() `
              -AliasesToExport @() `
              -VariablesToExport @() `
              -ProjectUri 'https://github.com/amiasea/powershell'

          Write-Host ""
          Write-Host "Generated: $manifestPath"

          Write-Host ""
          Write-Host "Generated module manifest:"
          Get-Content $manifestPath -Raw | Write-Host
          Write-Host ""

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ needs.prepare.outputs.module }}
          path: .build/${{ needs.prepare.outputs.module }}
          if-no-files-found: error
          overwrite: true


  test:
    name: Test
    needs: [prepare, manifest]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: build-${{ needs.prepare.outputs.module }}
          path: .build/${{ needs.prepare.outputs.module }}

      - name: Install Pester
        shell: pwsh
        run: |
          Install-PSResource `
              -Name Pester `
              -Version 6.0.1 `
              -Repository PSGallery `
              -TrustRepository `
              -Scope CurrentUser

      - name: Install required PowerShell modules
        shell: pwsh
        env:
          MODULE: ${{ needs.prepare.outputs.module }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $modulePath = Join-Path $PWD "src/$env:MODULE"
          $metadataPath = Join-Path $modulePath "$env:MODULE.json"

          $metadata = Get-Content $metadataPath -Raw |
              ConvertFrom-Json

          foreach ($requiredModule in @($metadata.requiredModules)) {
              if (-not $requiredModule.moduleName) {
                  throw "Required PowerShell module is missing moduleName."
              }

              if (-not $requiredModule.moduleVersion) {
                  throw "Required PowerShell module '$($requiredModule.moduleName)' is missing moduleVersion."
              }

              if (-not $requiredModule.repository) {
                  throw "Required PowerShell module '$($requiredModule.moduleName)' is missing repository."
              }

              Write-Host "Installing $($requiredModule.moduleName) $($requiredModule.moduleVersion) from $($requiredModule.repository)..."

              $installParameters = @{
                  Name            = $requiredModule.moduleName
                  Version         = $requiredModule.moduleVersion
                  Repository      = $requiredModule.repository
                  TrustRepository = $true
                  Scope           = 'CurrentUser'
              }

              if ($requiredModule.repository -eq 'Amiasea') {
                  if (-not $env:GITHUB_TOKEN) {
                      throw "GITHUB_TOKEN is required to install PowerShell modules from the Amiasea repository."
                  }

                  $credential = [System.Management.Automation.PSCredential]::new(
                      'USERNAME',
                      (ConvertTo-SecureString `
                          $env:GITHUB_TOKEN `
                          -AsPlainText `
                          -Force)
                  )

                  $installParameters['Credential'] = $credential
              }

              Install-PSResource @installParameters
          }

      - name: Test module
        shell: pwsh
        env:
          MODULE: ${{ needs.prepare.outputs.module }}
        run: |
          $buildPath = Join-Path $PWD ".build/$env:MODULE"
          $outPath = Join-Path $buildPath "out"
          $packageName = "Amiasea.$env:MODULE"
          $manifestPath = Join-Path $outPath "$packageName.psd1"
          $testPath = Join-Path $PWD "test/$env:MODULE"

          if (-not (Test-Path $manifestPath -PathType Leaf)) {
              throw "Built module manifest not found: $manifestPath"
          }

          if (-not (Test-Path $testPath -PathType Container)) {
              throw "Test directory not found: $testPath"
          }

          Import-Module $manifestPath -Force

          Invoke-Pester `
              -Path $testPath `
              -Output Detailed

      - name: Show build artifact
        shell: pwsh
        env:
          MODULE: ${{ needs.prepare.outputs.module }}
        run: |
          $outPath = Join-Path $PWD ".build/$env:MODULE/out"

          Write-Host "Built module artifact:"

          Get-ChildItem `
              -Path $outPath `
              -Recurse `
              -File |
              ForEach-Object {
                  Write-Host "  $($_.FullName.Substring($outPath.Length + 1))"
              }


  publish:
    name: Publish
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE_OWNER: Amiasea

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: build-${{ needs.prepare.outputs.module }}
          path: .build/${{ needs.prepare.outputs.module }}

      - name: Package PowerShell resource
        shell: pwsh
        env:
          MODULE: ${{ needs.prepare.outputs.module }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $buildPath = Join-Path $PWD ".build/$env:MODULE"
          $outPath = Join-Path $buildPath "out"
          $packageName = "$env:PACKAGE_OWNER.$env:MODULE"
          $packagePath = Join-Path $buildPath "$packageName.$env:VERSION.nupkg"

          Compress-PSResource `
              -Path $outPath `
              -DestinationPath $buildPath `
              -SkipModuleManifestValidate `
              -PassThru

          if (-not (Test-Path $packagePath -PathType Leaf)) {
              throw "PowerShell resource package was not created: $packagePath"
          }

          Write-Host ""
          Write-Host "Created PowerShell resource package:"
          Write-Host "  $packagePath"

      - name: Publish NuGet package
        shell: pwsh
        env:
          MODULE: ${{ needs.prepare.outputs.module }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $buildPath = Join-Path $PWD ".build/$env:MODULE"
          $packageName = "$env:PACKAGE_OWNER.$env:MODULE"
          $packagePath = Join-Path $buildPath "$packageName.$env:VERSION.nupkg"

          Write-Host "Publishing PowerShell resource package:"
          Write-Host "  $packagePath"

          dotnet nuget push `
              $packagePath `
              --source "https://nuget.pkg.github.com/$env:PACKAGE_OWNER/index.json" `
              --api-key $env:NUGET_AUTH_TOKEN `
              --skip-duplicate

      - name: Show package
        shell: pwsh
        env:
          MODULE: ${{ needs.prepare.outputs.module }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $buildPath = Join-Path $PWD ".build/$env:MODULE"
          $packageName = "$env:PACKAGE_OWNER.$env:MODULE"
          $packagePath = Join-Path $buildPath "$packageName.$env:VERSION.nupkg"

          Write-Host "Published PowerShell resource package:"
          Write-Host "  $packagePath"